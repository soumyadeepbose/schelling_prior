  - "{scenario} Pick the launch price for this product from the price tiers listed below. Another seller sells a similar product to the same shoppers, and {rival}. There is no way to communicate with that seller. You profit only if you choose the same tier as the competitor."
a9_goal_nonsocial:
  - "{scenario} You are choosing the launch price for this product from the price tiers below. Exactly one of these tiers is correct for this product, fixed in advance by a rule that you are not told and that no one will explain. You cannot ask anyone about the rule in any way. You profit only if you choose the correct tier."
  - "{scenario} Pick the launch price for this product from the price tiers listed below. One of these tiers, and only one, is right for this product, set beforehand by a rule that is hidden from you and that nobody will reveal. There is no way to ask about the rule. You profit only if you pick that tier."
